<body>

<!-- Layer 0: procedural / image background, painted well below the visualizer -->
<canvas id="backdrop" aria-hidden="true"></canvas>
<div class="backdrop-image" id="backdrop-image" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- Layer 1: the visualizer. On desktop it is parented into the WAVE_FORM window,
     on mobile it stays here and fills the screen. -->
<div class="stage" id="stage">
  <canvas id="visualizer" aria-label="Audio visualizer"></canvas>
</div>

<!-- Layer 2: the UI. Panels are generated from the control schema into whichever
     shell is active (floating windows on desktop, a bottom sheet on mobile). -->
<main class="shell" id="shell"></main>

<!-- Mobile chrome, inert on desktop -->
<nav class="tabbar" id="tabbar" aria-label="Panels"></nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Layer 3: CRT overlay, purely decorative -->
<div class="scanlines" aria-hidden="true"></div>

<noscript>
  <p class="noscript">HOW_I_LISTEN needs JavaScript: the visualizer is drawn live from the audio signal.</p>
